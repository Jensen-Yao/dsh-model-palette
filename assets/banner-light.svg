<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="315" viewBox="0 0 1200 315" role="img" aria-label="dsh-model-palette — Global model command palette for DeepSeek Harness">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#EFEAE0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="315" fill="url(#paper)"/>
  <!-- soft coral glow -->
  <circle cx="985" cy="70" r="210" fill="#D97757" opacity="0.07"/>
  <circle cx="1080" cy="230" r="150" fill="#7A8B6F" opacity="0.08"/>
  <!-- command motif -->
  <g transform="translate(96,74)">
    <rect width="132" height="132" rx="30" fill="#FFFDF8" stroke="#E3DCCC"/>
    <g transform="translate(30,30)">
      <circle cx="30" cy="30" r="27" fill="none" stroke="#D97757" stroke-width="5"/>
      <circle cx="30" cy="30" r="5" fill="#D97757"/>
      <line x1="49" y1="49" x2="66" y2="66" stroke="#D97757" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <!-- title -->
  <text x="268" y="152" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="58" font-weight="700" fill="#1F1B16">dsh-model-palette</text>
  <text x="270" y="196" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="23" fill="#6B6353">Global model command palette for DeepSeek Harness</text>
  <!-- effort bars motif -->
  <g transform="translate(270,226)" fill="#D97757">
    <rect x="0" y="16" width="7" height="10" rx="2"/>
    <rect x="12" y="11" width="7" height="15" rx="2"/>
    <rect x="24" y="6" width="7" height="20" rx="2"/>
    <rect x="36" y="0" width="7" height="26" rx="2"/>
  </g>
  <text x="322" y="247" font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#8A8072">Alt+M · Keyless free models · Codex-style reasoning meter · Loopback gateway</text>
</svg>
